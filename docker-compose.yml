services:
  caddy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    container_name: fuse-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fuse-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-http://localstack:4566/000000000000/scenario-execution}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      S3_URL: ${S3_URL:?S3_URL is required}
      # Пусто для внешнего S3 (порт и TLS берутся из схемы в S3_URL).
      S3_PORT: ${S3_PORT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-fuse}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      APP_URL: ${APP_URL:-http://localhost:${HTTP_PORT:-8081}}
      # Сколько прокси-хопов перед backend считать доверенными при разборе
      # X-Forwarded-For. В этом стеке перед ним ровно один Caddy. Без доверия к
      # заголовку req.ip равен адресу контейнера прокси и лимит частоты считает
      # всех пользователей одним клиентом.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Локальный вход по логину и паролю (в обход OAuth) для случая, когда весь
      # стек поднят в докере. По умолчанию пусто — маршрут отвечает 404.
      # Непустой пароль роняет бэкенд на старте в строгом режиме — то есть при
      # NODE_ENV=production ИЛИ когда адреса в конфигурации смотрят наружу
      # (см. config/external-config.ts). Для входа по паролю нужен локальный
      # профиль: NODE_ENV=development и инфраструктура на локальных адресах.
      DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:-}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-}
    expose:
      - "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Исполнитель сценариев: тот же образ, другая команда. Без container_name и
  # ports — иначе сервис не масштабируется; масштаб: docker compose up -d
  # --scale worker=N. Воркер не обслуживает HTTP, поэтому caddy и frontend от
  # него не зависят.
  #
  # BREAKING: без этого сервиса запуски остаются в pending — backend сам
  # очередь больше не потребляет.
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/backend/dist/worker-main"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # PORT/APP_URL воркеру не нужны, но остаются в общей env-схеме.
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-http://localstack:4566/000000000000/scenario-execution}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      # Сколько запусков держит ОДИН воркер (1–10). Больше — через число
      # реплик: docker compose up -d --scale worker=N.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      S3_URL: ${S3_URL:?S3_URL is required}
      # Пусто для внешнего S3 (порт и TLS берутся из схемы в S3_URL).
      S3_PORT: ${S3_PORT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-fuse}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      APP_URL: ${APP_URL:-http://localhost:${HTTP_PORT:-8081}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # HTTP у воркера нет — проверяется только живость процесса.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/worker-main > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: fuse-frontend
    restart: unless-stopped
    environment:
      NITRO_PORT: "5173"
      NUXT_PUBLIC_API_BASE_URL: /
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?NUXT_SESSION_SECRET is required}
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
