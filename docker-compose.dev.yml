# Инфраструктура для локальной разработки: MongoDB, LocalStack (SQS), Garage (S3).
#
# Здесь ТОЛЬКО инфраструктура. Фронтенд и бэкенд запускаются на хосте
# (`pnpm dev`) с hot-reload и ходят в эти контейнеры через localhost:
#
#   pnpm infra                        # поднять инфраструктуру
#   cp .env.local.example .env.local  # включить локальный профиль окружения
#   pnpm dev                          # фронт и бэк на хосте
#
# Полный стек в докере (backend + frontend + caddy) — это docker-compose.yml.
#
# Порты на хосте: mongo 27018, sqs 4566, s3 9000.
#
# ВАЖНО: значения ниже намеренно захардкожены и НЕ берутся из ${...}.
# Docker Compose автоматически читает корневой .env (но не .env.local), а там
# лежат БОЕВЫЕ креды и имя прод-бакета — при интерполяции локальное хранилище
# поднималось с прод-ключами и прод-именем бакета. Это локальная инфраструктура:
# креды фиксированные и должны совпадать с .env.local.example.
services:
  mongo:
    image: mongo:7
    container_name: fuse-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: fuse
      MONGO_INITDB_ROOT_PASSWORD: fusepassword
      MONGO_INITDB_DATABASE: fuse
    ports:
      # 27018 на хосте, чтобы не конфликтовать с системным mongod на 27017.
      - "27018:27017"
    volumes:
      - fuse-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  localstack:
    # latest (2026.x) требует LOCALSTACK_AUTH_TOKEN; 4.7 — последний community-образ
    image: localstack/localstack:4.7.0
    container_name: fuse-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh
    healthcheck:
      # Готовность = очередь реально создана init-скриптом, а не "контейнер поднялся".
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name scenario-execution || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # S3-совместимое хранилище. Бакет и ключ доступа Garage заводит сам при первом
  # старте (--single-node --default-bucket), поэтому отдельного бутстрап-контейнера
  # здесь нет. Веб-консоли у Garage тоже нет: смотреть бакет — через pnpm test:infra
  # или aws-cli/rclone на http://localhost:9000 (см. README).
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: fuse-garage
    restart: unless-stopped
    # Entrypoint у образа пустой, cmd по умолчанию — ["/garage", "server"],
    # поэтому путь к бинарю указываем явно.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: minioadmin
      # Не короче 16 символов: с более коротким Garage отказывается стартовать.
      # Значение должно совпадать с S3_SECRET_KEY в .env.local.example.
      GARAGE_DEFAULT_SECRET_KEY: fuse-local-dev-secret
      GARAGE_DEFAULT_BUCKET: fuse
    ports:
      # S3 API Garage слушает 3900, наружу отдаём привычный 9000 — чтобы
      # .env.local.example и дефолты S3_PORT в коде остались нетронутыми.
      - "9000:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - fuse-garage-meta:/var/lib/garage/meta
      - fuse-garage-data:/var/lib/garage/data
    healthcheck:
      # В образе нет шелла вообще, поэтому healthcheck только в exec-форме.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Мок внешнего API: на него смотрит baseUrl сид-приложения, чтобы api-шаги
  # сценариев исполнялись против локального эндпоинта, а не чужого сервиса.
  mock-api:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: fuse-mock-api
    restart: unless-stopped
    ports:
      - "8085:8080"

volumes:
  fuse-mongo-data:
  fuse-garage-meta:
  fuse-garage-data:
